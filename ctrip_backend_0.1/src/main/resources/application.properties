spring.application.name=backend

# Mysql datasource cfg.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ctrip_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JWT signing key. Set JWT_SECRET to a random value of at least 32 bytes.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.seed-demo-data=${SEED_DEMO_DATA:false}
app.mock-payment-enabled=${MOCK_PAYMENT_ENABLED:false}

# Mybatis rules.
# logger cfg.
mybatis.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
# parameter mapping.
mybatis.configuration.map-underscore-to-camel-case=true
# mapper xml location.
mybatis.mapper-locations=classpath:mapper/*.xml
# alias package cfg.
mybatis.type-aliases-package=top.potatohub.ctrip.backend.entities

# Custom Configuration
# Enable/Disable Login Interceptor
login.validate=true
